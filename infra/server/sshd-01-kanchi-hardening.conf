# Kanchi Vastra SSH policy. Loaded before 50-cloud-init.conf, and for sshd the
# first value read wins, so these override the cloud image defaults.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers kvops
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
# Local forwarding stays on: it is how the operator reaches internal tools
# (e.g. the test inbox) through an encrypted tunnel.
AllowTcpForwarding local
PermitEmptyPasswords no
Compression no
TCPKeepAlive no
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
Banner /etc/issue.net
